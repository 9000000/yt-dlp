<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ToolDL Pro - Trình Tạo License Key Di Động</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --success-hover: #047857;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .badge-pro {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .input-mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .quick-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .preset-btn {
            background-color: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .preset-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-generate {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-generate:hover {
            background-color: var(--success-hover);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            background-color: #0f172a;
            border: 1.5px dashed var(--primary);
            border-radius: 12px;
            padding: 16px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-display {
            background-color: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
            word-break: break-all;
            user-select: all;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .btn-copy {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔑 ToolDL License Generator <span class="badge-pro">PRO</span></h1>
        <p>Tạo mã kích hoạt bản quyền nhanh trên mọi thiết bị (Android/iOS/PC)</p>
    </div>

    <div class="form-group">
        <label for="machineId">Mã Machine ID thiết bị khách:</label>
        <input type="text" id="machineId" class="input-mono" value="ALL" placeholder="Nhập ALL hoặc TDL-XXXX-XXXX-XXXX" autocomplete="off">
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
            💡 Giữ nguyên <b>ALL</b> để dùng cho mọi máy tính, hoặc dán mã máy của khách.
        </div>
    </div>

    <div class="form-group">
        <label>Thời hạn bản quyền:</label>
        <div class="quick-presets">
            <button class="preset-btn active" data-days="0">Vĩnh viễn</button>
            <button class="preset-btn" data-days="30">30 ngày</button>
            <button class="preset-btn" data-days="90">3 tháng</button>
            <button class="preset-btn" data-days="365">1 năm</button>
            <button class="preset-btn" data-days="7">7 ngày</button>
            <button class="preset-btn" data-days="custom">Tùy chỉnh</button>
        </div>
    </div>

    <div class="form-group" id="customDaysGroup" style="display: none;">
        <label for="customDays">Nhập số ngày sử dụng:</label>
        <input type="number" id="customDays" value="30" min="1" max="3650">
    </div>

    <button class="btn-generate" id="btnGen">
        <span>✨ TẠO LICENSE KEY NGAY</span>
    </button>

    <div class="result-box" id="resultBox">
        <div class="result-title">
            <span>✅ KEY ĐÃ ĐƯỢC TẠO THÀNH CÔNG:</span>
            <span id="expiryText" style="color: #34d399; font-weight: normal;"></span>
        </div>
        <div class="key-display" id="keyDisplay"></div>
        <button class="btn-copy" id="btnCopy">
            <span>📋 SAO CHÉP KEY GỬI CHO KHÁCH</span>
        </button>
    </div>
</div>

<div class="toast" id="toast">📋 Đã sao chép License Key vào Clipboard!</div>

<script>
    const SECRET_SALT = "ToolDL_Pro_2026_Secure_License_Master_Key_Secret!#@987";
    let selectedDays = 0;

    // Quản lý Presets thời hạn
    const presetBtns = document.querySelectorAll('.preset-btn');
    const customDaysGroup = document.getElementById('customDaysGroup');
    const customDaysInput = document.getElementById('customDays');

    presetBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            presetBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const val = btn.getAttribute('data-days');
            if (val === 'custom') {
                customDaysGroup.style.display = 'block';
                selectedDays = parseInt(customDaysInput.value) || 30;
            } else {
                customDaysGroup.style.display = 'none';
                selectedDays = parseInt(val);
            }
        });
    });

    customDaysInput.addEventListener('input', () => {
        selectedDays = parseInt(customDaysInput.value) || 30;
    });

    // Thuật toán HMAC-SHA256 chuẩn Web Crypto
    async function hmacSha256(keyStr, messageStr) {
        const enc = new TextEncoder();
        const keyData = enc.encode(keyStr);
        const msgData = enc.encode(messageStr);

        const cryptoKey = await window.crypto.subtle.importKey(
            "raw",
            keyData,
            { name: "HMAC", hash: "SHA-256" },
            false,
            ["sign"]
        );

        const signature = await window.crypto.subtle.sign(
            "HMAC",
            cryptoKey,
            msgData
        );

        const hashArray = Array.from(new Uint8Array(signature));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex.substring(0, 16).toUpperCase();
    }

    // Base64URL encoding không padding
    function base64UrlEncode(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = '';
        for (let i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary)
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/, '');
    }

    // Tạo License Key
    async function generateLicenseKey(machineId, days) {
        const now = Math.floor(Date.now() / 1000);
        const expTime = days > 0 ? (now + days * 86400) : 0;

        // Payload có keys sắp xếp: e, i, m, t
        const payload = {
            e: expTime,
            i: now,
            m: (machineId || "ALL").trim().toUpperCase(),
            t: "FULL"
        };

        const payloadJson = JSON.stringify(payload);
        const payloadB64 = base64UrlEncode(payloadJson);
        const sig = await hmacSha256(SECRET_SALT, payloadB64);

        return {
            key: `${payloadB64}.${sig}`,
            expStr: days === 0 ? "Vĩnh viễn (Lifetime)" : `${days} ngày`
        };
    }

    // Nút Tạo Key
    const btnGen = document.getElementById('btnGen');
    const machineIdInput = document.getElementById('machineId');
    const resultBox = document.getElementById('resultBox');
    const keyDisplay = document.getElementById('keyDisplay');
    const expiryText = document.getElementById('expiryText');
    const btnCopy = document.getElementById('btnCopy');
    const toast = document.getElementById('toast');

    btnGen.addEventListener('click', async () => {
        let m = machineIdInput.value.trim() || "ALL";
        let days = selectedDays;
        if (customDaysGroup.style.display === 'block') {
            days = parseInt(customDaysInput.value) || 30;
        }

        const res = await generateLicenseKey(m, days);
        keyDisplay.innerText = res.key;
        expiryText.innerText = `⏳ Hạn: ${res.expStr}`;
        resultBox.style.display = 'block';

        // Tự động sao chép
        copyText(res.key);
    });

    // Nút Sao chép
    btnCopy.addEventListener('click', () => {
        const text = keyDisplay.innerText;
        if (text) {
            copyText(text);
        }
    });

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showToast);
        } else {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
            showToast();
        }
    }

    function showToast() {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }
</script>

</body>
</html>
